:root {
  --creme: #FBF7EC;
  --tinta: #13522F;
  --sol: #FDB112;
  --chama: #F56D1D;

  --mata: #148040;
  --folha: #3FA866;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {

  min-height: 100dvh;

  background: var(--creme);
  color: var(--tinta);
  font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

g%3E") repeat-x center top / auto 100%;
}
main {
  flex: 1 0 auto;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 1.6vh, 20px);
  padding: clamp(14px, 2.4vh, 32px) 20px clamp(16px, 2.6vh, 44px);
  text-align: center;
}
main > * { position: relative; z-index: 1; }
.logo { display: block; width: auto; height: clamp(104px, 16vh, 190px); }
.selo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  padding: 8px 18px 8px 10px;
  border-radius: 999px;
  background: #FDE3A1;
  font-size: 15px;
  font-weight: 700;
}
.selo span { width: 18px; height: 18px; border-radius: 50%; background: var(--chama); flex: none; }
h1 {
  margin: 0;
  font-family: "Baloo 2", "Trebuchet MS", sans-serif;
  font-size: clamp(40px, min(6.2vw, 9.6vh), 86px);
  font-weight: 800;
  line-height: 0.98;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.lead {
  max-width: 44ch;
  margin: 0;
  font-size: clamp(17px, 1.5vw, 21px);
  line-height: 1.5;
  text-wrap: balance;
}
.contato { margin: 4px 0 0; font-size: 16px; line-height: 1.5; }
a { color: var(--tinta); font-weight: 700; text-decoration-thickness: 2px; text-underline-offset: 4px; }
a:hover { color: var(--rio); }
a:focus-visible { outline: 3px solid var(--rio); outline-offset: 3px; border-radius: 4px; }
.tucano-ceu {
  position: absolute;
  z-index: 0;
  top: clamp(8px, 4vh, 48px);
  right: clamp(16px, 6vw, 110px);
  width: clamp(150px, 19vw, 300px);
  height: auto;
  overflow: visible;
}
.paisagem-wrap {
  flex: none;
  position: relative;
  overflow-x: clip;           /* the crossing toucan leaves the screen sideways without a scrollbar */
}
.paisagem {
  display: block;
  position: relative;
  z-index: 0;
  width: 100%;
  height: clamp(180px, 28vh, 380px);
  overflow: visible;          /* let the sun rise above the box, behind the text */
}
.travessia {
  position: absolute;
  z-index: 1;
  top: 6%;
  left: 60%;
  width: clamp(96px, 10vw, 156px);
  pointer-events: none;
}
.travessia svg { display: block; width: 100%; height: auto; overflow: visible; }

/* ---------- bichos animados ---------- */
.t-asa { transform-box: fill-box; transform-origin: 50% 100%; }
.capi { transform-box: fill-box; transform-origin: 50% 100%; }
.capi-olho { transform-box: fill-box; transform-origin: 50% 50%; }
.capi-orelha { transform-box: fill-box; transform-origin: 50% 100%; }
.bemtevi { transform-box: fill-box; transform-origin: 50% 100%; }
footer {
  flex: none;
  background: var(--mata);
  color: var(--creme);
  text-align: center;
}
footer p { margin: 0; padding: 10px 20px 14px; font-size: 14px; line-height: 1.5; }
.faixa {
  height: 12px;
  background: repeating-linear-gradient(-45deg, var(--sol) 0 14px, var(--tinta) 14px 28px);
}
@keyframes nascer { from { transform: translateY(80px); } to { transform: none; } }

/* tucano: bate, bate, plana (the toco toucan's bounding flight) */
@keyframes bater {
  0%, 100% { transform: scaleY(1); }
  8%       { transform: scaleY(-0.62); }
  16%      { transform: scaleY(1); }
  24%      { transform: scaleY(-0.62); }
  32%      { transform: scaleY(1); }
  42%, 88% { transform: scaleY(0.3); }
}
@keyframes embalo {
  0%, 100% { transform: translateY(0); }
  8%       { transform: translateY(-7px); }
  16%      { transform: translateY(-3px); }
  24%      { transform: translateY(-11px); }
  32%      { transform: translateY(-8px); }
  88%      { transform: translateY(5px); }
}
@keyframes pairar { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
@keyframes atravessar { from { transform: translateX(-110%); } to { transform: translateX(100vw); } }

/* capivara: respira, pisca, mexe a orelha; o bem-te-vi pula */
@keyframes respirar {
  0%, 100% { transform: scale(1, 1); }
  50%      { transform: scale(1.012, 1.035); }
}
@keyframes piscar {
  0%, 93%, 100% { transform: scaleY(1); }
  95.5%         { transform: scaleY(0.1); }
}
@keyframes orelha {
  0%, 60%, 76%, 100% { transform: rotate(0deg); }
  64%                { transform: rotate(-28deg); }
  68%                { transform: rotate(6deg); }
  72%                { transform: rotate(-16deg); }
}
@keyframes pulinho {
  0%, 50%, 100% { transform: translateY(0) rotate(0deg); }
  55%           { transform: translateY(-26px) rotate(-8deg); }
  60%           { transform: translateY(0) rotate(0deg); }
  65%           { transform: translateY(-14px) rotate(5deg); }
  70%           { transform: translateY(0) rotate(0deg); }
}

@media (prefers-reduced-motion: no-preference) {
  .sol { animation: nascer 2.8s cubic-bezier(.2, .7, .2, 1) both; }
  .t-asa { animation: bater 3.2s ease-in-out infinite; }
  .t-voo { animation: embalo 3.2s ease-in-out infinite; }
  .tucano-ceu { animation: pairar 6s ease-in-out infinite alternate; }
  .travessia { left: 0; animation: atravessar 19s linear infinite; animation-delay: -5s; }
  .travessia .t-asa, .travessia .t-voo { animation-delay: -1.4s; }
  .capi { animation: respirar 3.8s ease-in-out infinite; }
  .capi-olho { animation: piscar 5.4s linear infinite; }
  .capi-orelha { animation: orelha 7.5s ease-in-out infinite; animation-delay: -2s; }
  .bemtevi { animation: pulinho 4.6s ease-out infinite; }
}
@media (max-width: 860px) {
  .tucano-ceu { display: none; }
  .travessia { animation-duration: 11s; }
}
</style>
